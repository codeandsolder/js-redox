name: Cargo release-age quarantine

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quarantine:
    uses: codeandsolder/ci-workflows/.github/workflows/cargo-release-quarantine.yml@2376b14a6bc8263ab77013bd744248f49384b2fa # main
