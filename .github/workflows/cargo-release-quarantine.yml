name: Cargo release-age quarantine

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quarantine:
    uses: codeandsolder/ci-workflows/.github/workflows/cargo-release-quarantine.yml@2bf1fa8216c6b09836ea837d663ca616d0ec6427 # main
