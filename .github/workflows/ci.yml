name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: /usr/local/bin/sccache

permissions:
  contents: read

jobs:
  rust:
    name: Rust 1.99 quality gate
    runs-on: [self-hosted, Linux, X64, codeandsolder-private, ubuntu-24.04]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --locked --workspace
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
  semantic:
    name: Semantic/runtime regressions
    runs-on: [self-hosted, Linux, X64, codeandsolder-private, ubuntu-24.04]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: latest-known
      - name: Persisted capture contracts
        run: |
          uv run --no-project python scripts/check-capture-project-contract.py
          uv run --no-project python scripts/check-analysis-artifact-contract.py
      - name: Build analysis tools
        run: |
          cargo build --locked --workspace --bins
          mkdir -p .cargo-target-nodebug/debug
          install -m 0755 \
            target/debug/har-project \
            target/debug/jsvm-lift \
            target/debug/js-format \
            target/debug/switch-ir \
            target/debug/table-ir \
            target/debug/js-refs \
            target/debug/source-directives \
            target/debug/deobfuscate-safe \
            target/debug/bundle-unpack \
            target/debug/sourcemap-compose \
            target/debug/wasm-redox \
            target/debug/fresh-eval \
            target/debug/wasm-import-semantics \
            .cargo-target-nodebug/debug/
      - name: Safe deobfuscation runtime equivalence
        run: uv run --no-project python scripts/check-safe-deobfuscate.py
      - name: Static string recovery
        run: uv run --no-project python scripts/check-static-string-recovery.py
      - name: VM capture pipeline
        run: uv run --no-project python scripts/check-vm-capture-pipeline.py
      - name: WebAssembly capture pipeline
        run: uv run --no-project python scripts/check-wasm-capture-pipeline.py
      - name: WebAssembly copied-input boundary
        run: uv run --no-project python scripts/check-wasm-copied-input-boundary.py
