name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust quality gate
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@5991b873ab28ec8fae36c2c8ef944a3f67f5f9b3 # main
    with:
      rust-components: "rustfmt clippy"
      node-version: "26.13.1"
      timeout-minutes: 40
      command: |
        python_files="$(git ls-files '*.py' '*.pyw' '*.pyi')"
        python_shebang_files="$(
          while IFS= read -r -d '' file; do
            [[ -x "$file" ]] || continue
            IFS= read -r first_line < "$file" || true
            if [[ "$first_line" =~ ^#!.*(^|[[:space:]/])python([0-9.]*)?([[:space:]]|$) ]]; then
              printf '%s\n' "$file"
            fi
          done < <(git ls-files -z)
        )"
        if [[ -n "$python_files" || -n "$python_shebang_files" ]]; then
          printf 'tracked Python is not allowed in js-redox:\n%s\n%s\n' \
            "$python_files" "$python_shebang_files"
          exit 1
        fi
        bash scripts/check-oxc-source.sh
        node tools/cloak-recorder/check-nested-cdp-session.mjs
      strict-suites: |
        [
          {"name":"workspace"}
        ]
      test-suites: |
        [
          {"name":"workspace","cargo":["--locked","--workspace"],"doctests":["--locked","--workspace"]},
          {"name":"lift-runtime","cargo":["-p","jsvm-lift","--lib"],"nextest":["--run-ignored","only","-E","test(depythonify_safe_deob_) | test(node_confirms_)"]},
          {"name":"safe-core-runtime","cargo":["-p","jsvm-safe-core","--lib"],"nextest":["--run-ignored","only","-E","test(node_confirms_) | test(global_accessor_after_state_write_keeps_real_successor)"]}
        ]
