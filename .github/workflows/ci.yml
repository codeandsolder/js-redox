name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust 1.99 quality gate
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@b2414c5358d1061e9b442656298506e98c9d13e7 # main
    with:
      rust-toolchain: "1.99.1"
      rust-components: "rustfmt clippy"
      timeout-minutes: 20
      command: |
        cargo +1.99.1 fmt --all -- --check
        cargo +1.99.1 test --locked --workspace
        cargo +1.99.1 clippy --locked --workspace --all-targets -- -D warnings

  semantic:
    name: Semantic/runtime regressions
    needs: rust
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@b2414c5358d1061e9b442656298506e98c9d13e7 # main
    with:
      rust-toolchain: "1.99.1"
      timeout-minutes: 20
      command: |
        pipx install uv
        python3 scripts/check-capture-project-contract.py
        python3 scripts/check-analysis-artifact-contract.py
        node tools/cloak-recorder/check-nested-cdp-session.mjs
        cargo +1.99.1 build --locked --workspace --bins --target-dir .cargo-target-nodebug
        python3 scripts/check-har-pipeline.py
        python3 scripts/check-saved-page-pipeline.py
        python3 scripts/check-har-content-classification.py
        python3 scripts/check-safe-deobfuscate.py
        python3 scripts/check-deobfuscation-source-mode-pipeline.py
        python3 scripts/check-api-surface.py
        python3 scripts/check-static-string-recovery.py
        python3 scripts/check-vm-capture-pipeline.py
        python3 scripts/check-wasm-capture-pipeline.py
        python3 scripts/check-wasm-resource-provenance.py
        python3 scripts/check-wasm-copied-input-boundary.py
