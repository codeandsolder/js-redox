name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust 1.99 quality gate
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@bfade5fa936ccc3c68e562ae049602c85aa2f9ee # main
    with:
      rust-toolchain: "1.99.1"
      rust-components: "rustfmt clippy"
      timeout-minutes: 20
      command: |
        python_files="$(git ls-files '*.py' '*.pyw' '*.pyi')"
        python_shebang_files="$(
          while IFS= read -r -d '' file; do
            [[ -x "$file" ]] || continue
            IFS= read -r first_line < "$file" || true
            if [[ "$first_line" =~ ^#!.*(^|[[:space:]/])python([0-9.]*)?([[:space:]]|$) ]]; then
              printf '%s\n' "$file"
            fi
          done < <(git ls-files -z)
        )"
        if [[ -n "$python_files" || -n "$python_shebang_files" ]]; then
          printf 'tracked Python is not allowed in js-redox:\n%s\n%s\n' \
            "$python_files" "$python_shebang_files"
          exit 1
        fi
        cargo +1.99.1 fmt --all -- --check
        cargo +1.99.1 test --locked --workspace
        cargo +1.99.1 clippy --locked --workspace --all-targets -- -D warnings

  semantic:
    name: Semantic/runtime regressions
    needs: rust
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@bfade5fa936ccc3c68e562ae049602c85aa2f9ee # main
    with:
      rust-toolchain: "1.99.1"
      timeout-minutes: 20
      command: |
        node tools/cloak-recorder/check-nested-cdp-session.mjs
        cargo +1.99.1 test -p jsvm-lift --lib depythonify_safe_deob_ -- --ignored --nocapture
