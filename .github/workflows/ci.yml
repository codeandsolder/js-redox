name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust 1.99 quality gate
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@b2414c5358d1061e9b442656298506e98c9d13e7 # main
    with:
      rust-toolchain: "1.99.1"
      rust-components: "rustfmt clippy"
      timeout-minutes: 20
      command: |
        python_files="$(git ls-files '*.py')"
        if [[ -n "$python_files" ]]; then
          printf 'tracked Python is not allowed in js-redox:\n%s\n' "$python_files"
          exit 1
        fi
        cargo +1.99.1 fmt --all -- --check
        cargo +1.99.1 test --locked --workspace
        cargo +1.99.1 clippy --locked --workspace --all-targets -- -D warnings

  semantic:
    name: Semantic/runtime regressions
    needs: rust
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@b2414c5358d1061e9b442656298506e98c9d13e7 # main
    with:
      rust-toolchain: "1.99.1"
      timeout-minutes: 20
      command: |
        node tools/cloak-recorder/check-nested-cdp-session.mjs
        cargo +1.99.1 test -p jsvm-lift --lib depythonify_safe_deob_ -- --ignored --nocapture
