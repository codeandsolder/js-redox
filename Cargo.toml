[workspace]
members = [
    "src/jsvm-lift",
    "src/jsvm-safe-core",
    "src/sourcemap-compose",
    "src/wasm-redox",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "deny"
unfulfilled_lint_expectations = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"

[workspace.dependencies]
anyhow = "1"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
oxc_allocator = "0.153.0"
oxc_ast = "0.153.0"
oxc_ast_visit = "0.153.0"
oxc_codegen = "0.153.0"
oxc_ecmascript = "0.154.0"
oxc_semantic = "0.153.0"
oxc_span = "0.153.0"
oxc_syntax = "0.153.0"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
string_wizard = { git = "https://github.com/codeandsolder/rolldown-crates-redox.git", rev = "e93e85e", default-features = false }
rolldown_redox = { git = "https://github.com/codeandsolder/rolldown-crates-redox.git", rev = "e93e85e", default-features = false }
url = "2"
wasmparser = "0.262.0"
wasmprinter = "0.261.0"
waffle = { git = "https://github.com/codeandsolder/waffle.git", rev = "528b09ab97a67cda251fea2772040d29f7148851" }
