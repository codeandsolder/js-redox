[workspace]
members = [
    "src/jsvm-lift",
    "src/jsvm-safe-core",
    "prototypes/zipp-knitsail/ast-site-probe",
    "src/wasm-redox",
    "src/work-budget",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.100"

[workspace.lints.rust]
unsafe_code = "deny"
unfulfilled_lint_expectations = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"

[workspace.dependencies]
anyhow = "1"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
encoding_rs = "0.8"
html-escape = "0.3"
mime_guess = { version = "2", default-features = false }
rustix = "1.1.6"
oxc_allocator = "0.159.0"
oxc_ast = "0.159.0"
oxc_ast_visit = "0.159.0"
oxc_codegen = "0.159.0"
oxc_compat = "0.159.0"
oxc_cfg = "0.159.0"
oxc_diagnostics = "0.159.0"
oxc_ecmascript = "0.159.0"
oxc_parser = "0.159.0"
oxc_regular_expression = "0.159.0"
oxc_semantic = "0.159.0"
oxc_span = "0.159.0"
oxc_syntax = "0.159.0"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
sha2 = "0.11"
string_wizard = { git = "https://github.com/codeandsolder/rolldown-crates-redox.git", rev = "ff1f664348695eb2ef99a86757936888f0ab0649", default-features = false }
rolldown_redox = { git = "https://github.com/codeandsolder/rolldown-crates-redox.git", rev = "ff1f664348695eb2ef99a86757936888f0ab0649", default-features = false }
url = "2"
wreq = { git = "https://github.com/codeandsolder/wreq-exp.git", rev = "aad8f97d78e40c4c9fc0ddbb0cf88af870f848ac", default-features = false, features = ["tokio-rt", "cookies", "cookies-psl", "gzip", "brotli", "deflate", "stream"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time"] }
futures-util = { version = "0.3", default-features = false }
rustls-native-certs = "0.8"
wasmparser = "0.263.0"
wasmprinter = "0.263.0"
waffle = { git = "https://github.com/codeandsolder/waffle.git", rev = "840b3a674987311f8cb0fcd5cec60f355f0776b1" }
work-budget = { path = "src/work-budget" }

[patch.crates-io]
# Use one fork revision for the complete Oxc type universe, including transitive Rolldown dependencies.
oxc_allocator = { git = "https://github.com/codeandsolder/oxc.git", rev = "e06236d72ffefb736a9e68143c5a4807a576bef9" }
