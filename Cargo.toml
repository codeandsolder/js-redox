[workspace]
members = [
    "src/jsvm-lift",
    "src/jsvm-safe-core",
    "src/sourcemap-compose",
    "src/wasm-redox",
    "src/work-budget",
]
resolver = "2"
exclude = ["vendor/oxc_compat", "vendor/oxc_semantic"]

[workspace.package]
edition = "2021"
rust-version = "1.100"

[workspace.lints.rust]
unsafe_code = "deny"
unfulfilled_lint_expectations = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"

[workspace.dependencies]
anyhow = "1"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
encoding_rs = "0.8"
html-escape = "0.3"
mime_guess = "2"
oxc_allocator = "0.159.0"
oxc_ast = "0.159.0"
oxc_ast_visit = "0.159.0"
oxc_codegen = "0.159.0"
oxc_compat = "0.159.0"
oxc_cfg = "0.159.0"
oxc_diagnostics = "0.159.0"
oxc_ecmascript = "0.159.0"
oxc_parser = "0.159.0"
oxc_regular_expression = "0.159.0"
oxc_semantic = "0.159.0"
oxc_span = "0.159.0"
oxc_syntax = "0.159.0"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
sha2 = "0.11"
string_wizard = { git = "https://github.com/codeandsolder/rolldown-crates-redox.git", rev = "ff1f664348695eb2ef99a86757936888f0ab0649", default-features = false }
rolldown_redox = { git = "https://github.com/codeandsolder/rolldown-crates-redox.git", rev = "ff1f664348695eb2ef99a86757936888f0ab0649", default-features = false }
url = "2"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "cookies", "rustls", "gzip", "brotli", "deflate"] }
wasmparser = "0.263.0"
wasmprinter = "0.263.0"
waffle = { git = "https://github.com/codeandsolder/waffle.git", rev = "fad16a81f00657ee87f45cf9e668a138c2bd596a" }
work-budget = { path = "src/work-budget" }

# Temporary release-compatible backports of oxc-project/oxc#28542 and #29927.
[patch.crates-io]
oxc_semantic = { path = "vendor/oxc_semantic" }
oxc_compat = { path = "vendor/oxc_compat" }
zlib-rs = { git = "https://github.com/codeandsolder/zlib-rs-fast.git", rev = "1ec3a5612ee28803a7756fa52bd013389507a2db" }
