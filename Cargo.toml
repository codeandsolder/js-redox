[workspace]
members = [
    "src/jsvm-lift",
    "src/jsvm-safe-core",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.98"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
oxc_allocator = "0.138.0"
oxc_ast = "0.138.0"
oxc_ast_visit = "0.138.0"
oxc_codegen = "0.138.0"
oxc_ecmascript = "0.138.0"
oxc_parser = "0.138.0"
oxc_semantic = "0.138.0"
oxc_span = "0.138.0"
oxc_syntax = "0.138.0"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
